name: Test and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches metadata.txt version
        run: |
          version=$(sed -n 's/^version=//p' coordinate_formatter/metadata.txt)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME != metadata version $version"; exit 1; }
      - name: Build plugin zip
        run: |
          cp LICENSE coordinate_formatter/LICENSE
          zip -r "coordinate_formatter-$GITHUB_REF_NAME.zip" coordinate_formatter -x '*__pycache__*'
      - uses: softprops/action-gh-release@v2
        with:
          files: coordinate_formatter-*.zip
          generate_release_notes: true
